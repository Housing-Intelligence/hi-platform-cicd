name: Docker Build and Publish

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

      target_repository:
        description: "Target repository, e.g. Housing-Intelligence/hi-app-terraforms"
        required: true
        type: string

      app_directory:
        description: "Application directory, e.g. airflow"
        required: true
        type: string

      image_name:
        description: "Docker image name, e.g. airflow"
        required: true
        type: string

      image_tags:
        description: "Docker image tags, comma-separated, e.g. latest,3.3.1,abc123"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          path: app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAGS: ${{ inputs.image_tags }}
        run: |
          TAG_ARGS=""

          IFS=',' read -ra TAG_ARRAY <<< "$IMAGE_TAGS"

          for TAG in "${TAG_ARRAY[@]}"; do
            TAG="$(echo "$TAG" | xargs)"
            TAG_ARGS="$TAG_ARGS -t ${REGISTRY}/${IMAGE_NAME}:${TAG}"
          done

          docker buildx build \
            --platform linux/amd64 \
            -f app/${{ inputs.app_directory }}/docker/Dockerfile \
            ${TAG_ARGS} \
            --push \
            app/${{ inputs.app_directory }}