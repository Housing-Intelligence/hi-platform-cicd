name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment, e.g. dev or prod"
        required: true
        type: string

      # Target infrastructure repository
      target_repository:
        description: "Infrastructure repository, e.g. Housing-Intelligence/hi-backend"
        required: true
        type: string

      # Terraform directory inside target repository
      terraform_directory:
        description: "Terraform directory, e.g. backend/terraform"
        required: true
        type: string

      # Terraform parameters from upstream
      parameters_json:
        description: "Terraform parameters in JSON format"
        required: true
        type: string
      
      # Optional: Used as the folder name in hi-templates.
      infra_name:
        description: "Infrastructure name, used as template folder name, e.g. backend"
        required: false
        type: string

      # Optional: Used to select a template from hi-templates.
      template_name:
        description: "Template name, e.g. dev-mintest"
        required: false
        type: string

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      # Checkout infrastructure repository
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          path: target


      # Checkout templates repository
      - name: Checkout templates repository
        if: ${{ inputs.template_name != '' }}
        uses: actions/checkout@v4
        with:
          repository: Housing-Intelligence/hi-templates
          path: templates
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}


      # Prepare Terraform variables
      - name: Prepare Terraform variables
        working-directory: target/${{ inputs.terraform_directory }}
        env:
          PARAMETERS_JSON: ${{ inputs.parameters_json }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}

          VPC_ID: ${{ vars.AWS_VPC_ID }}
          PRIVATE_SUBNET_1: ${{ vars.AWS_PRIVATE_SUBNET_1 }}
          PRIVATE_SUBNET_2: ${{ vars.AWS_PRIVATE_SUBNET_2 }}
          PUBLIC_SUBNET_1: ${{ vars.AWS_PUBLIC_SUBNET_1 }}
          PUBLIC_SUBNET_2: ${{ vars.AWS_PUBLIC_SUBNET_2 }}

          INFRA_NAME: ${{ inputs.infra_name }}
          TEMPLATE_NAME: ${{ inputs.template_name }}

        run: |
          set -e

          echo "Preparing Terraform variables..."

          # Validate upstream JSON
          echo "$PARAMETERS_JSON" | jq empty

          echo "$PARAMETERS_JSON" > upstream.tfvars.json

          # Deal with no template
          if [ -z "$TEMPLATE_NAME" ]; then
            echo "No template specified."
            echo "Using upstream parameters directly."
            cp upstream.tfvars.json terraform.tfvars.json
          else
            if [ -z "$INFRA_NAME" ]; then
              echo "Error: infra_name is required when template_name is provided."
              exit 1
            fi
            TEMPLATE_PATH="${GITHUB_WORKSPACE}/templates/${INFRA_NAME}/${TEMPLATE_NAME}.json"

            echo "Template path: $TEMPLATE_PATH"

            if [ ! -f "$TEMPLATE_PATH" ]; then
              echo "Error: Template not found:"
              echo "$TEMPLATE_PATH"
              exit 1
            fi

            jq empty "$TEMPLATE_PATH"

            echo "Template found."
            echo "Merging template parameters with upstream parameters..."

            jq -s '.[0] * .[1]' \
              "$TEMPLATE_PATH" \
              upstream.tfvars.json \
              > terraform.tfvars.json
          fi

          # Add platform-controlled parameters
          jq \
            --arg aws_region "$AWS_REGION" \
            --arg environment "$ENVIRONMENT" \
            --arg vpc_id "$VPC_ID" \
            --arg private_subnet_1 "$PRIVATE_SUBNET_1" \
            --arg private_subnet_2 "$PRIVATE_SUBNET_2" \
            --arg public_subnet_1 "$PUBLIC_SUBNET_1" \
            --arg public_subnet_2 "$PUBLIC_SUBNET_2" \
            '. + {
              aws_region: $aws_region,
              environment: $environment,
              vpc_id: $vpc_id,
              private_subnet_ids: [
                $private_subnet_1,
                $private_subnet_2
              ],
              public_subnet_ids: [
                $public_subnet_1,
                $public_subnet_2
              ]
            }' \
            terraform.tfvars.json \
            > terraform.tfvars.json.tmp

          mv terraform.tfvars.json.tmp terraform.tfvars.json

          echo "Terraform variables prepared."

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # Check AWS identity
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity


      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # Terraform Init
      - name: Terraform Init
        working-directory: target/${{ inputs.terraform_directory }}
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          PARAMETERS_JSON: ${{ inputs.parameters_json }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.AWS_S3_BUCKET_REMOTE_STATE_NAME }}
        run: |
          set -e
          BACKEND_KEY="${TARGET_REPOSITORY}/${ENVIRONMENT}/terraform.tfstate"

          # Use workspace to separate their Terraform states.
          if [[ "$TARGET_REPOSITORY" == "Housing-Intelligence/hi-app-terraforms" ]]; then
            WORKSPACE=$(echo "$PARAMETERS_JSON" | jq -r '.workspace')

            if [[ -z "$WORKSPACE" || "$WORKSPACE" == "null" ]]; then
              echo "Error: workspace is required for hi-app-terraforms."
              exit 1
            fi

            BACKEND_KEY="${TARGET_REPOSITORY}/${ENVIRONMENT}/${WORKSPACE}/terraform.tfstate"
          fi

          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${BACKEND_KEY}" \
            -backend-config="region=${AWS_REGION}"

      # Terraform Destroy
      - name: Terraform Destroy
        working-directory: target/${{ inputs.terraform_directory }}
        run: |
          terraform destroy \
            -auto-approve \
            -var-file="terraform.tfvars.json"